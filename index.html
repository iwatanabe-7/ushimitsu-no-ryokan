<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>丑三つの宿</title>
</head>
<body>
<canvas id="view"></canvas>

<section id="title" class="layer">
  <h1 class="logo">丑三つの宿<small>うしみつのやど</small></h1>
  <div class="side">
    <div class="act-name"><b>椿の間にて</b><span>午前二時</span><span id="lapLabel" hidden>二周目</span></div>
    <p class="lead">夜中に目を覚ますと、襖が開かない。廊下の提灯だけが、まだ灯っている。丑三つ時が終わるまでに、宿から出る方法を探す。</p>
    <dl class="keys">
      <dt>W A S D</dt><dd>移動（Shift で少し速く）</dd>
      <dt>マウス</dt><dd>視点</dd>
      <dt>E</dt><dd>調べる・文章を送る</dd>
      <dt>Esc</dt><dd>一時停止・設定</dd>
    </dl>
    <div class="seen-row">見たエンディング<span class="seen-marks" id="titleSeen"></span></div>
    <p class="note">ヘッドホン推奨</p>
    <button id="start" class="btn" type="button" disabled>準備中</button>
  </div>
</section>

<section id="intro" class="layer" hidden>
  <p id="introLine"></p>
  <p class="skip">E・クリックで送る</p>
</section>

<div id="reticle" hidden></div>
<div id="prompt" hidden><kbd>E</kbd>調べる<span id="promptLabel"></span></div>

<div id="msg" hidden>
  <p id="msgText"></p>
  <span class="more">▼</span>
</div>
<p id="subtitle" hidden></p>

<div id="inv"></div>

<section id="ledger" class="layer" hidden>
  <div class="book">
    <div class="spread">
      <p class="spread-title">宿帳</p>
      <div id="ledgerRows"></div>
    </div>
    <div class="ledger-bar" id="ledgerActions">
      <button id="ledgerSign" class="btn" type="button">記帳する</button>
      <button id="ledgerClose" class="btn" type="button">閉じる</button>
    </div>
    <div class="ledger-bar" id="ledgerNameRow" hidden>
      <label for="ledgerName">名前</label>
      <input id="ledgerName" type="text" maxlength="8" autocomplete="off" spellcheck="false">
      <button id="ledgerWrite" class="btn" type="button">書く</button>
      <button id="ledgerCancel" class="btn" type="button">やめる</button>
    </div>
    <p id="ledgerCaption" hidden></p>
  </div>
</section>

<section id="lock" class="layer" hidden>
  <div class="lock-box">
    <p class="lock-title">花札錠</p>
    <div id="lockSlots"></div>
    <p class="lock-help">← → 札入れを選ぶ　↑ ↓ 札を替える　Enter 試す　Esc 戻る</p>
    <div class="lock-actions">
      <button id="lockTry" class="btn" type="button">試す</button>
      <button id="lockBack" class="btn" type="button">戻る</button>
    </div>
  </div>
</section>

<div id="touch" hidden>
  <div id="stick" hidden><div></div></div>
  <button id="act" type="button">調べる</button>
</div>

<section id="pause" class="layer" hidden>
  <div class="pause-box">
    <h2>一時停止</h2>
    <div class="settings">
      <label for="setVolume">音量</label><input id="setVolume" type="range" min="0" max="1" step="0.05">
      <label for="setSens">視点の速さ</label><input id="setSens" type="range" min="0.3" max="2.5" step="0.05">
      <label for="setQuality">画質</label>
      <select id="setQuality">
        <option value="high">高</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </select>
    </div>
    <div class="pause-actions">
      <button id="resume" class="btn" type="button">再開</button>
      <button id="setFull" class="btn" type="button">全画面</button>
      <button id="toTitle" class="btn" type="button">タイトルへ</button>
    </div>
  </div>
</section>

<section id="end" class="layer" hidden>
  <div class="end-box">
    <h2 id="endTitle"></h2>
    <div id="endLines"></div>
    <p id="endNote"></p>
    <div class="seen-row">見たエンディング<span class="seen-marks" id="endSeen"></span></div>
    <p class="thanks">遊んでくれてありがとうございました。感想をお待ちしています。</p>
    <button id="endToTitle" class="btn" type="button">タイトルへ</button>
  </div>
</section>

<section id="boot" class="layer"><p>宿を準備しています</p></section>

<script type="module" src="/src/boot.js"></script>
</body>
</html>
